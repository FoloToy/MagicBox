# Shared MagicBox client dependencies and the selected C5 BSP.
dependencies:
  bsp:
    path: boards/m301-c5-rtc-v1-5g/bsp
    rules:
    - if: target in [esp32c5]
  78/esp-wifi-connect: ~3.3.1
  espressif/esp_audio_effects: ~1.3.0
  espressif/esp_audio_codec: ~2.5.0
  78/esp-ml307: ~3.8.0
  78/uart-uhci:
    version: ^0.4.1
    rules:
    - if: target not in [esp32]
  78/uart-eth-modem:
    version: ~0.7.1
    rules:
    - if: target not in [esp32]
  78/xiaozhi-fonts: ~2.0.0
  espressif/led_strip: ~3.0.3
  espressif/esp_codec_dev: ~1.6.2
  espressif/esp-sr: ==2.4.7
  espressif/button: ~4.2.1
  espressif/knob: ^1.1.0
  espressif/esp32-camera:
    version: ^2.1.7
    rules:
    - if: target in [esp32s3]
  espressif/esp_video:
    version: ^2.4.1
    rules:
    - if: target in [esp32p4, esp32s3, esp32s31]
  espressif/esp_image_effects:
    version: ^1.1.0
    rules:
    - if: target not in [esp32]
  lvgl/lvgl: ~9.5.0
  esp_lvgl_port: ~2.9.0
  espressif2022/image_player: ^1.1.1
  espressif2022/esp_emote_expression: ^1.0.2
  espressif/esp_mmap_assets: ^1.4.0
  espressif/adc_battery_estimation: ^0.2.2
  espressif/esp_new_jpeg: ^1.0.2
  tny-robotics/sh1106-esp-idf: ^1.0.1
  espressif/iot_usbh_rndis:
    version: ^0.3.1
    rules:
    - if: target in [esp32s3, esp32p4]
  idf:
    version: '>=6.0.1'
  cube32esp/xpowerslib: ^0.3.3
